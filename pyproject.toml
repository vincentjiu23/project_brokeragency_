[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vin-agencybroker"
version = "3.3.0"
description = "VIN Project — Creative Commerce Operating System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
exclude = '''
/(
    \.git
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
    "addons/*/tests",
]
python_files = "test_*.py"
